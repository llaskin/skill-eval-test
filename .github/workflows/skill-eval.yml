name: Tessl Skill Eval
on:
  pull_request:
    paths: ['**/SKILL.md', '**/evals/**']

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: tesslio/skill-eval@feat/skill-eval
        with:
          eval-fail-on-regression: true
          tessl-token: ${{ secrets.TESSL_TOKEN }}
