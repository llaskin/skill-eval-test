name: Tessl Skill Review & Optimize
on:
  pull_request:
    paths: ['**/SKILL.md']

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: tesslio/skill-review-and-optimize@main
        with:
          fail-threshold: 70
          optimize: true
          optimize-iterations: 3
          inline-suggestions: true
          tessl-token: ${{ secrets.TESSL_TOKEN }}
